<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Handy AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cyan:#00f0ff;
    --green:#39ff88;
    --glass:rgba(255,255,255,0.045);
    --glass-border:rgba(255,255,255,0.14);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#000;color:#e8fffb;
    font-family:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  canvas#stage{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}
  video#cam{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-10px;top:-10px}

  /* film grain */
  body::after{
    content:"";position:fixed;inset:-50%;width:200%;height:200%;
    pointer-events:none;z-index:50;opacity:.11;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    animation:grain .9s steps(6) infinite;
  }
  @keyframes grain{
    0%{transform:translate(0,0)}
    20%{transform:translate(-4%,3%)}
    40%{transform:translate(3%,-5%)}
    60%{transform:translate(-5%,-2%)}
    80%{transform:translate(4%,4%)}
    100%{transform:translate(0,0)}
  }
  /* vignette */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
    background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%);
  }

  .brand{
    position:fixed;top:26px;left:30px;z-index:60;
    font-size:30px;font-weight:500;letter-spacing:.08em;
    color:#eaffff;
    text-shadow:0 0 6px var(--cyan),0 0 18px var(--cyan),0 0 42px rgba(0,240,255,.7),0 0 80px rgba(57,255,136,.45);
    animation:flicker 5s infinite;
  }
  .brand small{
    display:block;font-size:10px;font-weight:300;letter-spacing:.35em;opacity:.55;margin-top:4px;
    text-shadow:none;color:var(--green)
  }
  @keyframes flicker{
    0%,19%,21%,23%,80%,100%{opacity:1}
    20%,22%{opacity:.78}
    81%{opacity:.9}
  }

  .panel{
    position:fixed;top:50%;transform:translateY(-50%);z-index:60;
    padding:20px 22px;min-width:210px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:16px;
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 8px 40px rgba(0,0,0,.5),inset 0 0 30px rgba(0,240,255,.03);
    font-size:12px;letter-spacing:.06em;
  }
  .panel.left{left:26px}
  .panel.right{right:26px;max-width:260px}
  .panel h3{
    font-size:10px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;
    color:var(--cyan);opacity:.8;margin-bottom:14px;padding-bottom:10px;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:18px;margin:10px 0}
  .row span:first-child{opacity:.55;font-weight:300;text-transform:uppercase;font-size:10px;letter-spacing:.2em}
  .row b{font-weight:500;font-size:20px;color:#fff;text-shadow:0 0 10px rgba(0,240,255,.6)}
  .row b.status{font-size:12px;text-align:right;color:var(--green);text-shadow:0 0 10px rgba(57,255,136,.6)}
  .row b.status.err{color:#ff5577;text-shadow:0 0 10px rgba(255,85,119,.6)}
  .row b.status.warn{color:#ffd166;text-shadow:0 0 10px rgba(255,209,102,.6)}
  .panel ul{list-style:none}
  .panel li{
    position:relative;padding-left:18px;margin:14px 0;line-height:1.55;font-size:12px;font-weight:300;opacity:.9
  }
  .panel li::before{
    content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;border-radius:50%;
    background:var(--cyan);box-shadow:0 0 10px var(--cyan),0 0 20px var(--cyan);
  }
  .panel li:nth-child(2)::before{background:#ff3df2;box-shadow:0 0 10px #ff3df2,0 0 20px #ff3df2}
  .panel li:nth-child(3)::before{background:var(--green);box-shadow:0 0 10px var(--green),0 0 20px var(--green)}

  @media (max-width:760px){
    .brand{font-size:22px;top:18px;left:18px}
    .panel{padding:12px 14px;min-width:0;font-size:10px}
    .panel.left{left:10px;top:auto;bottom:14px;transform:none}
    .panel.right{right:10px;top:auto;bottom:14px;transform:none;max-width:52vw}
    .row b{font-size:15px}
    .panel li{font-size:10px;margin:8px 0}
  }
</style>
</head>
<body>

<video id="cam" playsinline autoplay muted></video>
<canvas id="stage"></canvas>

<div class="brand">Handy AI<small>REAL-TIME HAND TRACKING</small></div>

<div class="panel left">
  <h3>Telemetry</h3>
  <div class="row"><span>Hands Detected</span><b id="hands">0</b></div>
  <div class="row"><span>FPS</span><b id="fps">0</b></div>
  <div class="row"><span>Device Status</span><b id="status" class="status warn">Requesting…</b></div>
</div>

<div class="panel right">
  <h3>Instructions</h3>
  <ul>
    <li>Pinch index + thumb to draw</li>
    <li>Use both hands for lightning arcs</li>
    <li>Open hand to energize the core</li>
  </ul>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
(() => {
  "use strict";

  const video  = document.getElementById("cam");
  const canvas = document.getElementById("stage");
  const ctx    = canvas.getContext("2d");
  const elHands  = document.getElementById("hands");
  const elFps    = document.getElementById("fps");
  const elStatus = document.getElementById("status");

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  function setStatus(text, cls) {
    elStatus.textContent = text;
    elStatus.className = "status" + (cls ? " " + cls : "");
  }

  /* ---------- helpers ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  const CONNECTIONS = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [5,9],[9,10],[10,11],[11,12],
    [9,13],[13,14],[14,15],[15,16],
    [13,17],[17,18],[18,19],[19,20],[0,17]
  ];
  const TIPS = [4, 8, 12, 16, 20];

  function toScreen(l) {
    const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
    const s = Math.max(W / vw, H / vh);
    const ox = (W - vw * s) / 2, oy = (H - vh * s) / 2;
    return { x: (1 - l.x) * vw * s + ox, y: l.y * vh * s + oy };
  }

  /* ---------- state ---------- */
  let hands = [];
  const strokes = [];
  const activeStroke = [null, null];
  const pinchState = [false, false];
  const charge = [0, 0];
  const particles = [];
  const rings = [];

  function spawn(x, y, n, opt = {}) {
    for (let i = 0; i < n; i++) {
      if (particles.length > 900) particles.shift();
      const a = rand(0, Math.PI * 2), sp = rand(opt.minSp ?? 0.4, opt.maxSp ?? 3.2);
      particles.push({
        x, y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, decay: rand(0.012, 0.03),
        size: rand(1, opt.size ?? 2.6),
        hue: opt.hue ?? rand(160, 200)
      });
    }
  }

  /* ---------- tracking results ---------- */
  function onResults(res) {
    const list = [];
    const lms = res.multiHandLandmarks || [];
    for (const lm of lms) {
      const pts = lm.map(toScreen);
      const size = dist(pts[0], pts[9]) || 1;
      const pd = dist(pts[4], pts[8]);
      const palm = {
        x: (pts[0].x + pts[5].x + pts[9].x + pts[13].x + pts[17].x) / 5,
        y: (pts[0].y + pts[5].y + pts[9].y + pts[13].y + pts[17].y) / 5
      };
      const fingers = [[8,6],[12,10],[16,14],[20,18]];
      let open = fingers.every(([t, p]) => dist(pts[t], pts[0]) > dist(pts[p], pts[0]) * 1.12);
      open = open && dist(pts[4], pts[17]) > dist(pts[3], pts[17]);
      list.push({
        pts, size, pd, palm, open,
        pinchRatio: pd / size,
        pinchPt: { x: (pts[4].x + pts[8].x) / 2, y: (pts[4].y + pts[8].y) / 2 }
      });
    }
    list.sort((a, b) => a.palm.x - b.palm.x);
    hands = list;
    elHands.textContent = hands.length;
    if (hands.length) setStatus("Tracking", "");
    else setStatus("Camera active", "warn");
  }

  /* ---------- lightning ---------- */
  function boltPath(a, b, disp, depth) {
    let pts = [a, b];
    let d = disp;
    for (let i = 0; i < depth; i++) {
      const next = [];
      for (let j = 0; j < pts.length - 1; j++) {
        const p = pts[j], q = pts[j + 1];
        const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
        const dx = q.x - p.x, dy = q.y - p.y;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len, ny = dx / len;
        const off = (Math.random() - 0.5) * d;
        next.push(p, { x: mx + nx * off, y: my + ny * off });
      }
      next.push(pts[pts.length - 1]);
      pts = next;
      d *= 0.55;
    }
    return pts;
  }

  function strokePath(pts, color, width, blur, alpha) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.globalAlpha = alpha;
    ctx.shadowColor = color;
    ctx.shadowBlur = blur;
    ctx.lineJoin = "round";
    ctx.stroke();
  }

  function drawLightning(a, b) {
    const d = dist(a, b);
    const disp = clamp(d * 0.14, 14, 90);
    const intensity = clamp(1.2 - d / (Math.max(W, H) * 0.9), 0.35, 1);

    ctx.save();
    ctx.globalCompositeOperation = "lighter";

    const layers = [
      { c: "#ff2bd6", w: 5, b: 28, a: 0.35 * intensity },
      { c: "#00f0ff", w: 3.2, b: 22, a: 0.7 * intensity },
      { c: "#ffe34d", w: 2, b: 16, a: 0.6 * intensity }
    ];
    for (const L of layers) {
      const main = boltPath(a, b, disp * rand(0.8, 1.2), 6);
      strokePath(main, L.c, L.w, L.b, L.a);
      const nb = 2 + (Math.random() * 3 | 0);
      for (let i = 0; i < nb; i++) {
        const s = main[(Math.random() * (main.length - 4) | 0) + 2];
        const ang = rand(0, Math.PI * 2), len = rand(30, 120) * intensity;
        const e = { x: s.x + Math.cos(ang) * len, y: s.y + Math.sin(ang) * len };
        strokePath(boltPath(s, e, len * 0.5, 4), L.c, L.w * 0.5, L.b * 0.6, L.a * 0.8);
      }
    }
    strokePath(boltPath(a, b, disp * 0.7, 6), "#ffffff", 1.4, 10, 0.95);

    for (const p of [a, b]) {
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 46);
      g.addColorStop(0, "rgba(255,255,255,.95)");
      g.addColorStop(.25, "rgba(0,240,255,.55)");
      g.addColorStop(1, "rgba(255,43,214,0)");
      ctx.globalAlpha = 1; ctx.shadowBlur = 0;
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, 46, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    if (Math.random() < 0.9) {
      const t = Math.random();
      spawn(a.x + (b.x - a.x) * t + rand(-20, 20), a.y + (b.y - a.y) * t + rand(-20, 20), 2,
        { hue: rand(280, 330), maxSp: 2.2 });
    }

    ctx.save();
    ctx.font = '11px "DM Mono", monospace';
    ctx.fillStyle = "rgba(200,255,255,.8)";
    ctx.shadowColor = "#00f0ff"; ctx.shadowBlur = 8;
    ctx.textAlign = "center";
    ctx.fillText(`ARC ${Math.round(d)}px · ${Math.round(intensity * 100)}%`, (a.x + b.x) / 2, (a.y + b.y) / 2 - 18);
    ctx.restore();
  }

  /* ---------- wireframe ---------- */
  function drawHand(h, idx) {
    const p = h.pts;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";

    ctx.shadowBlur = 0;
    ctx.beginPath();
    for (const [i, j] of CONNECTIONS) { ctx.moveTo(p[i].x, p[i].y); ctx.lineTo(p[j].x, p[j].y); }
    ctx.strokeStyle = "rgba(0,240,255,.18)"; ctx.lineWidth = 10; ctx.stroke();

    for (const [i, j] of CONNECTIONS) {
      const g = ctx.createLinearGradient(p[i].x, p[i].y, p[j].x, p[j].y);
      g.addColorStop(0, "#00f0ff"); g.addColorStop(1, "#39ff88");
      ctx.beginPath(); ctx.moveTo(p[i].x, p[i].y); ctx.lineTo(p[j].x, p[j].y);
      ctx.strokeStyle = g; ctx.lineWidth = 2.2;
      ctx.shadowColor = "#00f0ff"; ctx.shadowBlur = 14; ctx.stroke();
    }

    for (let i = 0; i < p.length; i++) {
      const tip = TIPS.includes(i);
      ctx.beginPath();
      ctx.arc(p[i].x, p[i].y, tip ? 5 : 3, 0, Math.PI * 2);
      ctx.fillStyle = tip ? "#ffffff" : "#39ff88";
      ctx.shadowColor = tip ? "#00f0ff" : "#39ff88";
      ctx.shadowBlur = tip ? 20 : 10;
      ctx.fill();
    }

    let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
    for (const q of p) { minX = Math.min(minX, q.x); minY = Math.min(minY, q.y); maxX = Math.max(maxX, q.x); maxY = Math.max(maxY, q.y); }
    const pad = 22; minX -= pad; minY -= pad; maxX += pad; maxY += pad;
    const L = 16;
    ctx.shadowBlur = 8; ctx.shadowColor = "#00f0ff";
    ctx.strokeStyle = "rgba(0,240,255,.7)"; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(minX, minY + L); ctx.lineTo(minX, minY); ctx.lineTo(minX + L, minY);
    ctx.moveTo(maxX - L, minY); ctx.lineTo(maxX, minY); ctx.lineTo(maxX, minY + L);
    ctx.moveTo(maxX, maxY - L); ctx.lineTo(maxX, maxY); ctx.lineTo(maxX - L, maxY);
    ctx.moveTo(minX + L, maxY); ctx.lineTo(minX, maxY); ctx.lineTo(minX, maxY - L);
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.font = '10px "DM Mono", monospace';
    ctx.fillStyle = "rgba(180,255,240,.75)";
    ctx.fillText(`HAND_${idx + 1}${h.open ? " · OPEN" : ""}${h.pinchRatio < 0.32 ? " · PINCH" : ""}`, minX, minY - 8);
    ctx.restore();
  }

  /* ---------- draw mode ---------- */
  function updateDrawing(now) {
    for (let i = 0; i < 2; i++) {
      const h = hands[i];
      if (!h) { pinchState[i] = false; activeStroke[i] = null; continue; }
      const was = pinchState[i];
      const pinching = was ? h.pinchRatio < 0.45 : h.pinchRatio < 0.3;
      pinchState[i] = pinching;
      if (pinching) {
        if (!was) {
          activeStroke[i] = { pts: [], hueBase: (now / 18) % 360 };
          strokes.push(activeStroke[i]);
          rings.push({ x: h.pinchPt.x, y: h.pinchPt.y, r: 4, life: 1 });
          spawn(h.pinchPt.x, h.pinchPt.y, 24, { hue: activeStroke[i].hueBase, maxSp: 4 });
        }
        const s = activeStroke[i];
        const last = s.pts[s.pts.length - 1];
        const np = { x: h.pinchPt.x, y: h.pinchPt.y, t: now };
        if (!last || Math.hypot(np.x - last.x, np.y - last.y) > 2) {
          if (last) { np.x = last.x * 0.35 + np.x * 0.65; np.y = last.y * 0.35 + np.y * 0.65; }
          s.pts.push(np);
          spawn(np.x, np.y, 1, { hue: (s.hueBase + s.pts.length * 2) % 360, maxSp: 1.2, size: 2 });
        }
      } else {
        activeStroke[i] = null;
      }
    }
  }

  const TRAIL_LIFE = 3200;
  function drawStrokes(now) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (let si = strokes.length - 1; si >= 0; si--) {
      const s = strokes[si];
      while (s.pts.length && now - s.pts[0].t > TRAIL_LIFE) s.pts.shift();
      if (!s.pts.length && s !== activeStroke[0] && s !== activeStroke[1]) { strokes.splice(si, 1); continue; }
      for (let i = 1; i < s.pts.length; i++) {
        const a = s.pts[i - 1], b = s.pts[i];
        const age = clamp(1 - (now - b.t) / TRAIL_LIFE, 0, 1);
        const hue = (s.hueBase + i * 2.2 + now / 40) % 360;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = `hsla(${hue},100%,60%,${age * 0.28})`;
        ctx.lineWidth = 16 * age + 2; ctx.shadowBlur = 0; ctx.stroke();
        ctx.strokeStyle = `hsla(${hue},100%,72%,${age * 0.9})`;
        ctx.lineWidth = 5 * age + 1; ctx.shadowColor = `hsl(${hue},100%,60%)`; ctx.shadowBlur = 16; ctx.stroke();
        ctx.strokeStyle = `rgba(255,255,255,${age})`;
        ctx.lineWidth = 1.5 * age; ctx.shadowBlur = 0; ctx.stroke();
      }
    }
    for (let i = 0; i < 2; i++) {
      const h = hands[i];
      if (!h) continue;
      const pinching = pinchState[i];
      const pp = h.pinchPt;
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(pp.x, pp.y, pinching ? 10 + Math.sin(now / 80) * 2 : 14, 0, Math.PI * 2);
      ctx.strokeStyle = pinching ? "rgba(255,255,255,.95)" : "rgba(0,240,255,.35)";
      ctx.lineWidth = pinching ? 2 : 1;
      ctx.shadowColor = "#00f0ff"; ctx.shadowBlur = pinching ? 20 : 6;
      ctx.stroke();
    }
    ctx.restore();
  }

  /* ---------- energy core ---------- */
  function drawCore(h, i, now, dt) {
    const target = h.open ? 1 : 0;
    charge[i] += (target - charge[i]) * clamp(dt * (target ? 2.2 : 4), 0, 1);
    const c = charge[i];
    if (c < 0.03) return;
    const { x, y } = h.palm;
    const R = h.size * (0.35 + c * 0.75);
    const t = now / 1000;

    ctx.save();
    ctx.globalCompositeOperation = "lighter";

    const g = ctx.createRadialGradient(x, y, 0, x, y, R * 2.6);
    g.addColorStop(0, `rgba(255,255,255,${0.9 * c})`);
    g.addColorStop(0.18, `rgba(57,255,200,${0.6 * c})`);
    g.addColorStop(0.5, `rgba(0,160,255,${0.22 * c})`);
    g.addColorStop(1, "rgba(120,0,255,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, R * 2.6, 0, Math.PI * 2); ctx.fill();

    ctx.shadowColor = "#00f0ff"; ctx.shadowBlur = 16;
    for (let k = 0; k < 3; k++) {
      const rr = R * (0.7 + k * 0.38);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(t * (k % 2 ? -1.4 : 1.1) + k);
      ctx.setLineDash([rr * 0.35, rr * 0.18, rr * 0.05, rr * 0.18]);
      ctx.strokeStyle = k === 1 ? `rgba(255,61,242,${0.8 * c})` : `rgba(0,240,255,${0.85 * c})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, rr, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    ctx.setLineDash([]);

    ctx.save();
    ctx.translate(x, y); ctx.rotate(-t * 0.7);
    ctx.beginPath();
    for (let k = 0; k <= 6; k++) {
      const a = (k / 6) * Math.PI * 2;
      const rr = R * 0.55;
      ctx[k ? "lineTo" : "moveTo"](Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.strokeStyle = `rgba(57,255,136,${0.9 * c})`; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.restore();

    for (let k = 0; k < 8; k++) {
      const a = t * (1.6 + k * 0.13) + k * 0.8;
      const rr = R * (0.9 + 0.35 * Math.sin(t * 2 + k));
      ctx.beginPath();
      ctx.arc(x + Math.cos(a) * rr, y + Math.sin(a) * rr * 0.8, 2.6, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${170 + k * 18},100%,75%,${c})`;
      ctx.shadowColor = `hsl(${170 + k * 18},100%,60%)`; ctx.shadowBlur = 14; ctx.fill();
    }

    if (c > 0.35) {
      for (const tpi of TIPS) {
        const tip = h.pts[tpi];
        const path = boltPath({ x, y }, tip, 18 * c, 4);
        strokePath(path, "#00f0ff", 1.6, 14, 0.55 * c);
        strokePath(path, "#fff", 0.8, 4, 0.7 * c);
      }
    }

    const pulse = 1 + Math.sin(t * 9) * 0.12;
    const n = ctx.createRadialGradient(x, y, 0, x, y, R * 0.32 * pulse);
    n.addColorStop(0, "#fff"); n.addColorStop(1, "rgba(0,240,255,0)");
    ctx.shadowBlur = 0; ctx.globalAlpha = c; ctx.fillStyle = n;
    ctx.beginPath(); ctx.arc(x, y, R * 0.32 * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    if (c > 0.85 && Math.random() < 0.6) spawn(x, y, 3, { hue: rand(150, 200), maxSp: 5, minSp: 1.5 });
  }

  /* ---------- particles / rings ---------- */
  function drawParticles() {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vx *= 0.97; p.vy *= 0.97; p.vy += 0.015;
      p.life -= p.decay;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life + 0.3, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue},100%,70%,${p.life})`;
      ctx.shadowColor = `hsl(${p.hue},100%,60%)`; ctx.shadowBlur = 10;
      ctx.fill();
    }
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      r.r += 3.2; r.life -= 0.03;
      if (r.life <= 0) { rings.splice(i, 1); continue; }
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(0,240,255,${r.life})`; ctx.lineWidth = 2;
      ctx.shadowColor = "#00f0ff"; ctx.shadowBlur = 12; ctx.stroke();
    }
    ctx.restore();
  }

  /* ---------- background grid ---------- */
  function drawBackdrop(now) {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    if (video.readyState >= 2 && video.videoWidth) {
      const vw = video.videoWidth, vh = video.videoHeight;
      const s = Math.max(W / vw, H / vh);
      const ox = (W - vw * s) / 2, oy = (H - vh * s) / 2;
      ctx.save();
      ctx.globalAlpha = 0.2;
      ctx.translate(ox + vw * s, oy);
      ctx.scale(-s, s);
      ctx.drawImage(video, 0, 0, vw, vh);
      ctx.restore();
      ctx.fillStyle = "rgba(0,0,0,.35)";
      ctx.fillRect(0, 0, W, H);
    }

    ctx.save();
    ctx.strokeStyle = "rgba(0,240,255,.045)";
    ctx.lineWidth = 1;
    const gs = 60, off = (now / 60) % gs;
    ctx.beginPath();
    for (let x = -gs + off; x < W; x += gs) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = -gs + off; y < H; y += gs) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
    ctx.restore();
  }

  /* ---------- render loop ---------- */
  let lastT = performance.now(), frames = 0, fpsT = lastT;
  function render(now) {
    const dt = Math.min((now - lastT) / 1000, 0.1);
    lastT = now;

    drawBackdrop(now);
    updateDrawing(now);
    drawStrokes(now);

    hands.forEach((h, i) => { drawHand(h, i); if (i < 2) drawCore(h, i, now, dt); });
    if (hands.length < 2) { charge[1] = hands.length < 2 ? charge[1] * 0.9 : charge[1]; }
    if (!hands[0]) charge[0] *= 0.9;

    if (hands.length >= 2) drawLightning(hands[0].pts[8], hands[1].pts[8]);

    drawParticles();

    frames++;
    if (now - fpsT >= 500) {
      elFps.textContent = Math.round(frames * 1000 / (now - fpsT));
      frames = 0; fpsT = now;
    }
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  /* ---------- camera + MediaPipe ---------- */
  let handsModel = null;
  let running = false;

  async function startCamera() {
    setStatus("Requesting camera…", "warn");
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("getUserMedia unavailable (use HTTPS or localhost)");
      }
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play().catch(() => {});
      await new Promise(res => {
        if (video.readyState >= 2) res(); else video.onloadeddata = () => res();
      });
      setStatus("Loading model…", "warn");
      return true;
    } catch (err) {
      console.error("[Handy AI] Camera initialization failed:", err);
      let msg = "Camera error";
      if (err && err.name === "NotAllowedError") msg = "Permission denied";
      else if (err && err.name === "NotFoundError") msg = "No camera found";
      else if (err && err.name === "NotReadableError") msg = "Camera busy";
      setStatus(msg, "err");
      return false;
    }
  }

  async function initModel() {
    if (typeof Hands === "undefined") {
      console.error("[Handy AI] MediaPipe Hands failed to load from CDN.");
      setStatus("Model load failed", "err");
      return false;
    }
    try {
      handsModel = new Hands({
        locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
      });
      handsModel.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.5
      });
      handsModel.onResults(onResults);
      await handsModel.initialize();
      return true;
    } catch (err) {
      console.error("[Handy AI] Model initialization failed:", err);
      setStatus("Model init failed", "err");
      return false;
    }
  }

  async function loop() {
    if (!running) return;
    try {
      if (video.readyState >= 2) await handsModel.send({ image: video });
    } catch (err) {
      console.error("[Handy AI] Frame processing error:", err);
    }
    requestAnimationFrame(loop);
  }

  async function boot() {
    const camOk = await startCamera();
    if (!camOk) return;
    const modelOk = await initModel();
    if (!modelOk) return;
    setStatus("Camera active", "warn");
    running = true;
    loop();
  }

  // prompt for camera permission immediately on load
  boot();
})();
</script>
</body>
</html>
